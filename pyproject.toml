[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-entrega-1"
version = "1.0.0"
description = "Solução recursiva do Projeto do Robô - Entrega 1"
requires-python = ">=3.10"

[project.scripts]
robo = "robo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
